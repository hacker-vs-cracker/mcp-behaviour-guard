name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mcp_behaviour_guard
      - run: pytest

  integration-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Run STDIO security contract
        env:
          DEMO_AGENT_TOKEN: ci-fake-secret
        run: >-
          mcp-guard run contracts/stdio-demo.yaml
          --lab-mode
          --no-fail
          --output reports-stdio
          --database .guard/stdio.db

      - name: Verify STDIO regression evidence
        run: python scripts/verify_demo_report.py stdio reports-stdio

      - name: Run temporal metadata-drift demo
        run: >-
          mcp-guard run contracts/temporal-demo.yaml
          --no-fail
          --output reports-temporal
          --database .guard/temporal.db

      - name: Verify temporal regression evidence
        run: python scripts/verify_demo_report.py temporal reports-temporal

      - name: Start HTTP lab
        run: docker compose up --build -d --wait

      - name: Run HTTP security contract
        run: >-
          mcp-guard run contracts/http-demo.yaml
          --lab-mode
          --no-fail
          --output reports-http
          --database .guard/http.db

      - name: Verify HTTP regression evidence
        run: python scripts/verify_demo_report.py http reports-http

      - if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build runner image for smoke tests
        run: docker build -f Dockerfile.runner -t mcp-guard-runner:ci .

      - name: Verify runner executes as UID 10001
        run: |
          uid="$(docker run --rm --entrypoint id mcp-guard-runner:ci -u)"
          test "$uid" = "10001"

      - name: Verify runner CLI starts
        run: docker run --rm mcp-guard-runner:ci --help

      - name: Validate multi-architecture runner build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.runner
          push: false
          platforms: linux/amd64,linux/arm64

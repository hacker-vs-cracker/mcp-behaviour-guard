name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/mcp_behaviour_guard
      - run: pytest

  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: pytest -m "not integration"

  integration-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Run STDIO security contract
        env:
          DEMO_AGENT_TOKEN: ci-fake-secret
        run: >-
          mcp-guard run contracts/stdio-demo.yaml
          --lab-mode
          --no-fail
          --output reports-stdio
          --database .guard/stdio.db

      - name: Verify STDIO regression evidence
        run: python scripts/verify_demo_report.py stdio reports-stdio

      - name: Run temporal metadata-drift demo
        run: >-
          mcp-guard run contracts/temporal-demo.yaml
          --no-fail
          --output reports-temporal
          --database .guard/temporal.db

      - name: Verify temporal regression evidence
        run: python scripts/verify_demo_report.py temporal reports-temporal

      - name: Start HTTP lab
        run: docker compose up --build -d --wait

      - name: Run HTTP security contract
        run: >-
          mcp-guard run contracts/http-demo.yaml
          --lab-mode
          --no-fail
          --output reports-http
          --database .guard/http.db

      - name: Verify HTTP regression evidence
        run: python scripts/verify_demo_report.py http reports-http

      - if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runner image for smoke tests
        run: docker build -f Dockerfile.runner -t mcp-guard-runner:ci .

      - name: Verify runner executes as UID 10001
        run: |
          uid="$(docker run --rm --entrypoint id mcp-guard-runner:ci -u)"
          test "$uid" = "10001"

      - name: Verify runner CLI starts
        run: docker run --rm mcp-guard-runner:ci --help

      - name: Run installed runner contract and verify reports
        env:
          DEMO_AGENT_TOKEN: ci-fake-secret
        run: |
          rm -rf runner-smoke-output
          mkdir -p runner-smoke-output/runtime
          chmod 0777 runner-smoke-output runner-smoke-output/runtime
          docker run --rm \
            --env DEMO_AGENT_TOKEN \
            --mount type=bind,src="$PWD/contracts/stdio-demo.yaml",dst=/input/stdio-demo.yaml,readonly \
            --mount type=bind,src="$PWD/demo",dst=/work/demo,readonly \
            --mount type=bind,src="$PWD/runner-smoke-output",dst=/out \
            --mount type=bind,src="$PWD/runner-smoke-output/runtime",dst=/work/demo_runtime \
            mcp-guard-runner:ci \
            run /input/stdio-demo.yaml \
            --lab-mode \
            --no-fail \
            --output /out/reports \
            --database /out/guard.db
          test "$(stat -c '%u' runner-smoke-output/guard.db)" = "10001"
          python3 scripts/verify_demo_report.py stdio runner-smoke-output/reports

      - name: Validate multi-architecture runner build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runner
          push: false
          platforms: linux/amd64,linux/arm64

name: publish-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]

          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid stable release tag: {tag}")

          tag_version = tag.removeprefix("v")
          project_version = tomllib.loads(
              Path("pyproject.toml").read_text()
          )["project"]["version"]

          if tag_version != project_version:
              raise SystemExit(
                  f"Tag version {tag_version} != package version {project_version}"
              )

          print(f"VERSION_OK={project_version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify v0.4.1 tested artifacts
        if: github.event.release.tag_name == 'v0.4.1'
        run: |
          echo "c0eb233de99b6b3489feb09155fc1ed6df2ebd298597ee52e6ff87cda32660b7  dist/mcp_behaviour_guard-0.4.1-py3-none-any.whl" | sha256sum --check
          echo "a4e3dadfb17d367fda9135b31a5ef453811916be34752135eb35fa8487a80510  dist/mcp_behaviour_guard-0.4.1.tar.gz" | sha256sum --check

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/mcp-behaviour-guard

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true
          print-hash: true

name: publish-to-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          tag="$RELEASE_TAG"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $tag" >&2
            exit 1
          fi

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            echo "Refusing to publish a prerelease to production PyPI: $tag" >&2
            exit 1
          fi

          if [[ "$RELEASE_REF" != "refs/tags/$tag" ]]; then
            echo "Release ref $RELEASE_REF does not match release tag $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify release source identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"

          echo "release event SHA: $EXPECTED_SHA"
          echo "checked-out HEAD:   $head_sha"
          echo "tag commit:         $tag_sha"

          test "$head_sha" = "$tag_sha"
          test "$head_sha" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.14"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]

          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid stable release tag: {tag}")

          tag_version = tag.removeprefix("v")
          project_version = tomllib.loads(
              Path("pyproject.toml").read_text()
          )["project"]["version"]

          if tag_version != project_version:
              raise SystemExit(
                  f"Tag version {tag_version} != package version {project_version}"
              )

          print(f"VERSION_OK={project_version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify built wheel installation
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)

          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          smoke="$RUNNER_TEMP/mcpbg-release-smoke"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install --upgrade pip
          "$smoke/bin/python" -m pip install "${wheels[0]}"

          RELEASE_VERSION="${RELEASE_TAG#v}" "$smoke/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import mcp_behaviour_guard

          expected = os.environ["RELEASE_VERSION"]
          dist_version = importlib.metadata.version("mcp-behaviour-guard")
          runtime_version = mcp_behaviour_guard.__version__

          if dist_version != expected:
              raise SystemExit(
                  f"installed distribution version {dist_version} != {expected}"
              )
          if runtime_version != expected:
              raise SystemExit(
                  f"runtime version {runtime_version} != {expected}"
              )

          print(f"INSTALLED_VERSION_OK={expected}")
          PY

          "$smoke/bin/mcp-guard" --help >/dev/null
          echo "CLI_SMOKE_OK=1"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/mcp-behaviour-guard

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

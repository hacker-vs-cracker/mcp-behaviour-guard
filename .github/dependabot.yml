version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:37"
      timezone: "Etc/UTC"
    # Routine Python version-update PRs stay manual during the current
    # compatibility phase. Dependabot security updates remain enabled by the
    # repository security setting and are not disabled by this value.
    open-pull-requests-limit: 0

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-behaviour-guard"
version = "0.2.0"
description = "Deterministic security contract and behavioural regression testing for MCP servers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Arjun Arjun" }]
keywords = ["mcp", "security", "appsec", "ai-security", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.24,<5",
  "mcp==1.28.1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
mcp-guard = "mcp_behaviour_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_behaviour_guard"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the Docker demo environment"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["mcp_behaviour_guard"]
